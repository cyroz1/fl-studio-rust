name: CI and desktop installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache: true

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libasound2-dev libxcb1-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xdotool

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Prepare macOS signing and notarization
        id: macos-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          secret_names=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_API_KEY
            APPLE_API_ISSUER
            APPLE_API_KEY_CONTENT
          )
          present=0
          for name in "${secret_names[@]}"; do
            if [[ -n "${!name}" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping the signed macOS installer because Developer ID signing and notarization secrets are not configured; CI will still build and inspect an unsigned app bundle."
            {
              echo "### macOS installer skipped"
              echo
              echo "The macOS tests have passed. CI will build and inspect the unsigned app bundle, then upload it as a short-lived GUI preview artifact for local testing. The preview is not a distributable installer; configure signing and notarization credentials to publish a verified disk image. See [macOS CI packaging](docs/macos-ci-packaging.md)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$present" -ne "${#secret_names[@]}" ]]; then
            echo "::error::macOS signing configuration is incomplete. Configure all six secrets listed in docs/macos-ci-packaging.md."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path("Packager.toml").read_text(encoding="utf-8")
          config += "\n[macos]\nsigning-identity = "
          config += json.dumps(os.environ["APPLE_SIGNING_IDENTITY"])
          config += "\n"
          Path("Packager.signed.toml").write_text(config, encoding="utf-8")
          PY

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Install Cargo Packager
        run: cargo install cargo-packager --locked

      - name: Build desktop installers (Linux and Windows)
        if: runner.os != 'macOS'
        run: cargo packager --release

      - name: Capture desktop UI on a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/gui-preview
          cat > "$RUNNER_TEMP/capture-ui.sh" <<'BASH'
          set -euo pipefail
          target/release/fl-studio-rebuild > "$RUNNER_TEMP/gui-preview.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/gui-preview.log"
              exit 1
            fi
            sleep 1
          done
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/startup.png"
          xdotool mousemove 65 301 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/browser-search-options.png"
          xdotool mousemove 382 111 click 1
          sleep 1
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/channel-rack.png"
          xdotool mousemove 682 111 click 1
          sleep 1
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/audio-settings.png"

          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          app_pid=""
          python3 - "$RUNNER_TEMP/mixer-preview.flp" "$RUNNER_TEMP/controller-preview.flp" <<'PY'
          import struct
          import sys
          from pathlib import Path

          def data_event(opcode, payload):
              size = len(payload)
              encoded_size = bytearray()
              while size >= 0x80:
                  encoded_size.append((size & 0x7F) | 0x80)
                  size >>= 7
              encoded_size.append(size)
              return bytes([opcode]) + bytes(encoded_size) + payload

          def dword_event(opcode, value):
              return bytes([opcode]) + struct.pack("<i", value)

          arrangement_meter_markers = (
              bytes([0x63, 0, 0])
              + dword_event(0x94, 0x08000000)
              + bytes([0x21, 3, 0x22, 4])
              + dword_event(0x94, 0x08000000 | 576)
              + bytes([0x21, 5, 0x22, 8])
              + bytes([0x62, 0, 0])
          )

          def playlist_track(track_id, name, grouped=False):
              state = bytearray(70)
              struct.pack_into("<I", state, 0, track_id)
              state[12] = 1
              state[46] = int(grouped)
              return (
                  data_event(0xEE, bytes(state))
                  + bytes([0x2B, 0])
                  + data_event(0xEF, name.encode("utf-8") + b"\0")
              )

          playlist_track_states = (
              playlist_track(1, "Drums")
              + playlist_track(2, "Percussion", grouped=True)
              + playlist_track(3, "Bass")
          )

          target = 64 << 6
          parameters = (
              bytes([0xAA, 0xBB, 0xCC, 0xDD, 192, 0])
              + struct.pack("<H", target)
              + struct.pack("<i", 12800)
              + bytes([0x11, 0x22, 0x33, 0x44, 193, 0])
              + struct.pack("<H", target)
              + struct.pack("<i", 0)
          )
          event_stream = (
              arrangement_meter_markers
              + playlist_track_states
              + dword_event(0x9A, -1)
              + dword_event(0x93, 0)
              + dword_event(0x95, 0x006A8DCE)
              + data_event(0xEC, bytes(4) + struct.pack("<I", 1 << 3) + bytes(4))
              + data_event(0xCC, b"Drum Bus\0")
              + data_event(0xE1, parameters)
          )
          project = (
              b"FLhd"
              + struct.pack("<IHHH", 6, 0, 0, 96)
              + b"FLdt"
              + struct.pack("<I", len(event_stream))
              + event_stream
          )
          Path(sys.argv[1]).write_bytes(project)

          controller_records = b"".join(
              struct.pack("<I2sBBf", position, b"\xA5\x5A", 2, 0x24, value)
              for position, value in [(0, 0.15), (192, 0.78), (384, 0.36), (576, 0.9)]
          )

          def pattern_note(channel_id, key, position=0):
              return struct.pack(
                  "<IHHIHH8B",
                  position,
                  0x4000,
                  channel_id,
                  192,
                  key,
                  0,
                  0,
                  0,
                  0,
                  0,
                  64,
                  100,
                  0,
                  0,
              )

          note_records = (
              pattern_note(0, 60)
              + pattern_note(0, 64, 96)
              + pattern_note(0, 67, 192)
              + pattern_note(1, 64, 288)
          )
          pattern_events = (
              bytes([0x40, 0, 0, 0x40, 1, 0, 0x41, 7, 0])
              + data_event(0xD0, note_records)
              + data_event(0xDF, controller_records)
          )
          controller_project = (
              b"FLhd"
              + struct.pack("<IHHH", 6, 0, 0, 96)
              + b"FLdt"
              + struct.pack("<I", len(pattern_events))
              + pattern_events
          )
          Path(sys.argv[2]).write_bytes(controller_project)
          PY

          target/release/fl-studio-rebuild "$RUNNER_TEMP/mixer-preview.flp" \
            > "$RUNNER_TEMP/mixer-preview.log" 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mixer-preview.log"
              exit 1
            fi
            sleep 1
          done
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-meter.png"
          xdotool mousemove 700 276 click 1
          sleep 1
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-seek.png"
          xdotool mousemove 351 302 keydown Control_L click 1 keyup Control_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-solo.png"
          xdotool mousemove 351 329 keydown Alt_L click 3 keyup Alt_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-group-solo.png"
          xdotool mousemove 376 302 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-groups-collapsed.png"
          xdotool mousemove 625 111 click 1
          sleep 2
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer.png"
          xdotool mousemove 356 270 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-muted.png"
          xdotool mousemove 398 270 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-muted-solo.png"
          xdotool mousemove 1219 321 click 1
          sleep 0.3
          xdotool mousemove 1322 321 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-phase-swap.png"

          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          app_pid=""
          target/release/fl-studio-rebuild "$RUNNER_TEMP/controller-preview.flp" \
            > "$RUNNER_TEMP/controller-preview.log" 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/controller-preview.log"
              exit 1
            fi
            sleep 1
          done
          controller_window=$(xdotool search --onlyvisible --name '^FL Studio Rebuild$' | head -n 1 || true)
          if [[ -z "$controller_window" ]]; then
            echo "Could not find the controller preview window for keyboard interaction checks."
            cat "$RUNNER_TEMP/controller-preview.log"
            exit 1
          fi
          xdotool windowfocus --sync "$controller_window"
          xdotool key F7
          sleep 1
          xdotool mousemove 414 16 click 1
          sleep 0.5
          xdotool mousemove 510 67 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/controller-roll.png"
          xdotool mousemove 400 260 keydown Control_L
          sleep 0.2
          xdotool mousedown 1
          sleep 0.2
          xdotool mousemove 420 260
          sleep 0.2
          xdotool mouseup 1
          xdotool keyup Control_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/piano-roll-time-selection.png"
          xdotool mousemove 350 578 keydown Control_L
          sleep 0.2
          xdotool mousedown 1
          sleep 0.2
          xdotool mousemove 350 526
          sleep 0.2
          xdotool mouseup 1
          xdotool keyup Control_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/piano-roll-pitch-selection.png"
          xdotool mousemove 414 525 keydown Alt_L click 4 keyup Alt_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/piano-roll-mousewheel-property.png"
          xdotool mousemove 400 192 click 1
          sleep 0.3
          xdotool mousemove 500 315
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/controller-ghost-visibility.png"
          xdotool key Escape
          xdotool key Escape
          xdotool mousemove 900 500 click 1
          sleep 0.2
          xdotool windowfocus --sync "$controller_window"
          xdotool key ctrl+alt+v
          sleep 0.5
          xdotool mousemove 400 192 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/controller-ghost-editable.png"
          xdotool key Escape
          xdotool windowfocus --sync "$controller_window"
          xdotool key ctrl+alt+v
          sleep 0.5
          xdotool mousemove 400 192 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/controller-ghost-editable-shortcut.png"
          xdotool key Escape
          xdotool mousemove 410 556 click 1
          sleep 0.3
          xdotool windowfocus --sync "$controller_window"
          xdotool key shift+c
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/controller-color-selection.png"
          xdotool mousemove 455 741 click 1
          sleep 0.3
          xdotool mousemove 440 720 click 1
          sleep 1
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "The controller preview app exited while changing the Piano roll event target."
            cat "$RUNNER_TEMP/controller-preview.log"
            exit 1
          fi
          xdotool mousemove 600 820 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/controller-events.png"
          if [[ "$(stat -c%s "$GITHUB_WORKSPACE/dist/gui-preview/controller-events.png")" -lt 10000 ]]; then
            echo "The controller preview capture is blank or incomplete."
            cat "$RUNNER_TEMP/controller-preview.log"
            exit 1
          fi
          for capture in browser-search-options.png playlist-solo.png playlist-group-solo.png playlist-groups-collapsed.png \
            mixer.png mixer-muted.png mixer-muted-solo.png mixer-phase-swap.png controller-ghost-visibility.png \
            controller-ghost-editable.png controller-ghost-editable-shortcut.png controller-color-selection.png \
            piano-roll-time-selection.png piano-roll-pitch-selection.png piano-roll-mousewheel-property.png; do
            if [[ "$(stat -c%s "$GITHUB_WORKSPACE/dist/gui-preview/$capture")" -lt 10000 ]]; then
              echo "The $capture capture is blank or incomplete."
              cat "$RUNNER_TEMP/mixer-preview.log"
              exit 1
            fi
          done
          BASH
          xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24 +extension GLX" \
            bash "$RUNNER_TEMP/capture-ui.sh"

      - name: Upload Linux GUI preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-gui-preview
          path: dist/gui-preview/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Build signed and notarized macOS installer
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo packager --release --config Packager.signed.toml

      - name: Build unsigned macOS app for CI verification
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'false'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Packager.toml").read_text(encoding="utf-8")
          default_formats = 'formats = ["default"]'
          if source.count(default_formats) != 1:
              raise SystemExit("Packager.toml must declare exactly one default formats line")
          smoke_config = source.replace(default_formats, 'formats = ["app"]', 1)
          Path("Packager.macos-smoke.toml").write_text(smoke_config, encoding="utf-8")
          PY
          cargo packager --release --config Packager.macos-smoke.toml

      - name: Verify unsigned macOS app bundle metadata
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'false'
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Cargo Packager did not produce a macOS app bundle."
            exit 1
          fi
          python3 - "$app_path" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          with (app / "Contents" / "Info.plist").open("rb") as plist_file:
              info = plistlib.load(plist_file)

          executable = info.get("CFBundleExecutable")
          if not executable or not (app / "Contents" / "MacOS" / executable).is_file():
              raise SystemExit("macOS app bundle is missing its declared executable")

          extensions = {
              extension.lower()
              for document_type in info.get("CFBundleDocumentTypes", [])
              for extension in document_type.get("CFBundleTypeExtensions", [])
              if isinstance(extension, str)
          }
          if "flp" not in extensions:
              raise SystemExit("macOS app bundle is missing its .flp file association")
          print("Unsigned macOS app bundle and .flp association are valid")
          PY

      - name: Archive unsigned macOS GUI preview
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'false'
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Cargo Packager did not produce a macOS app bundle."
            exit 1
          fi
          preview_dir="dist/macos-unsigned-preview"
          mkdir -p "$preview_dir"
          ditto "$app_path" "$preview_dir/$(basename "$app_path")"
          cat > "$preview_dir/README-FIRST.txt" <<'EOF'
          This is an unsigned macOS CI preview. Gatekeeper can label it “damaged” because
          it was downloaded from the internet without a Developer ID signature and notarization.

          To open this preview, open Terminal, change to this folder, then run:

              xattr -dr com.apple.quarantine "FL Studio Rebuild.app"
              open "FL Studio Rebuild.app"

          A signed and notarized disk image is produced only when the repository's Apple
          Developer ID and notarization secrets are configured.
          EOF
          ditto -c -k --sequesterRsrc --keepParent \
            "$preview_dir" dist/fl-studio-rebuild-macos-unsigned-preview.zip

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'true'
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Cargo Packager did not produce a macOS app bundle."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Launch and capture native macOS GUI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::Cargo Packager did not produce a macOS app bundle."
            exit 1
          fi
          app_path="$(cd "$(dirname "$app_path")" && pwd)/$(basename "$app_path")"
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          app_binary="$app_path/Contents/MacOS/$app_executable"
          if [[ ! -x "$app_binary" ]]; then
            echo "::error::The macOS app bundle executable is missing or not executable."
            exit 1
          fi

          preview_dir="dist/macos-gui-preview"
          mkdir -p "$preview_dir"
          app_pid=""
          cleanup() {
            if [[ -n "$app_pid" ]]; then
              kill "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          open -a "$app_path"
          for attempt in $(seq 1 30); do
            app_pid="$(pgrep -f "$app_binary" | head -n 1 || true)"
            if [[ -n "$app_pid" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "$app_pid" ]]; then
            echo "::error::The packaged macOS app did not stay running after launch."
            exit 1
          fi
          sleep 3
          if screencapture -x "$preview_dir/startup.png" && [[ -s "$preview_dir/startup.png" ]]; then
            echo "Captured the native macOS startup window."
          else
            echo "::warning::The macOS app launched, but the runner could not capture its screen."
            rm -f "$preview_dir/startup.png"
          fi

      - name: Upload Linux and Windows installers
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed macOS disk image
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned macOS GUI preview
        if: runner.os == 'macOS' && steps.macos-signing.outputs.configured == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned-gui-preview
          path: dist/fl-studio-rebuild-macos-unsigned-preview.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload native macOS screenshot
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-native-gui-preview
          path: dist/macos-gui-preview/startup.png
          if-no-files-found: warn
          retention-days: 14

      - name: Remove temporary macOS signing files
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f Packager.signed.toml Packager.macos-smoke.toml "${APPLE_API_KEY_PATH:-}"
