name: CI and desktop installers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Verify and package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache: true

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg libasound2-dev libxcb1-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb xdotool

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Check macOS signing credentials
        if: runner.os == 'macOS'
        id: macos-signing-status
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          secret_names=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_API_KEY
            APPLE_API_ISSUER
            APPLE_API_KEY_CONTENT
          )
          present=0
          for name in "${secret_names[@]}"; do
            if [[ -n "${!name}" ]]; then
              present=$((present + 1))
            fi
          done

          if [[ "$present" -eq 0 ]]; then
            echo "::error::macOS signing credentials are required to publish a Gatekeeper-ready installer. Configure all six secrets listed in docs/macos-ci-packaging.md."
            {
              echo "### macOS installer unavailable"
              echo
              echo "This matrix job requires all six Apple signing and notarization secrets listed in [macOS CI packaging](docs/macos-ci-packaging.md). It will not report success without producing and verifying a Gatekeeper-ready installer."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$present" -ne "${#secret_names[@]}" ]]; then
            echo "::error::macOS signing configuration is incomplete. Configure all six secrets listed in docs/macos-ci-packaging.md."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS' && steps.macos-signing-status.outputs.available == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path("Packager.toml").read_text(encoding="utf-8")
          config += "\n[macos]\nsigning-identity = "
          config += json.dumps(os.environ["APPLE_SIGNING_IDENTITY"])
          config += "\n"
          Path("Packager.signed.toml").write_text(config, encoding="utf-8")
          PY

          keychain_path="$RUNNER_TEMP/fl-studio-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="$RUNNER_TEMP/fl-studio-signing.p12"
          umask 077
          python3 - "$certificate_path" <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          encoded = os.environ["APPLE_CERTIFICATE"].replace("\n", "").replace("\r", "")
          Path(sys.argv[1]).write_bytes(base64.b64decode(encoded, validate=True))
          PY

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" \
            $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$keychain_path" \
            | grep -F -- "\"$APPLE_SIGNING_IDENTITY\""; then
            echo "::error::The Developer ID signing identity was not imported into the temporary keychain."
            exit 1
          fi

          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_CERTIFICATE_PATH=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Install Cargo Packager
        run: cargo install cargo-packager --version 0.11.8 --locked --force

      - name: Build desktop installers (Linux and Windows)
        if: runner.os != 'macOS'
        run: cargo packager --release

      - name: Install Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          shopt -s nullglob
          packages=(dist/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "::error::Expected exactly one Linux .deb installer; found ${#packages[@]}."
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          sudo apt-get install --yes "./${packages[0]}"
          test -x /usr/bin/fl-studio-rebuild
          test -x /usr/bin/vst3-host-helper

      - name: Install and launch Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -Path dist -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows setup installer; found $($installers.Count)."
          }

          $installPath = Join-Path $env:LOCALAPPDATA 'FL Studio Rebuild'
          $installerProcess = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -Wait -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "Windows setup exited with code $($installerProcess.ExitCode)."
          }

          $appPath = Join-Path $installPath 'fl-studio-rebuild.exe'
          $helperPath = Join-Path $installPath 'vst3-host-helper.exe'
          if (-not (Test-Path -LiteralPath $appPath -PathType Leaf)) {
            throw "Installed app executable is missing: $appPath"
          }
          if (-not (Test-Path -LiteralPath $helperPath -PathType Leaf)) {
            throw "Installed VST3 helper is missing: $helperPath"
          }

          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'fl-studio-ui-config'
          New-Item -ItemType Directory -Path $env:APPDATA -Force | Out-Null
          $app = Start-Process -FilePath $appPath -WorkingDirectory $installPath -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) {
              throw "Installed app exited with code $($app.ExitCode)."
            }
            Write-Host 'Installed app remained running after launch.'
          } finally {
            if (-not $app.HasExited) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Capture desktop UI on a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/gui-preview
          cat > "$RUNNER_TEMP/capture-ui.sh" <<'BASH'
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/fl-studio-ui-config"
          rm -rf "$XDG_CONFIG_HOME"
          target/release/fl-studio-rebuild > "$RUNNER_TEMP/gui-preview.log" 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 20); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/gui-preview.log"
              exit 1
            fi
            sleep 1
          done
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/startup.png"
          xdotool mousemove 65 301 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/browser-search-options.png"
          xdotool mousemove 382 111 click 1
          sleep 1
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/channel-rack.png"
          xdotool mousemove 287 16 click 1
          sleep 0.3
          xdotool mousemove 350 162 click 1
          sleep 1
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/audio-settings.png"
          xdotool mousemove 1100 700 click --repeat 8 --delay 40 5
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/audio-settings-scrolled.png"

          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true
          app_pid=""
          python3 - "$RUNNER_TEMP/mixer-preview.flp" "$RUNNER_TEMP/controller-preview.flp" "$RUNNER_TEMP/pattern-preview.flp" <<'PY'
          import struct
          import sys
          from pathlib import Path

          def data_event(opcode, payload):
              size = len(payload)
              encoded_size = bytearray()
              while size >= 0x80:
                  encoded_size.append((size & 0x7F) | 0x80)
                  size >>= 7
              encoded_size.append(size)
              return bytes([opcode]) + bytes(encoded_size) + payload

          def dword_event(opcode, value):
              return bytes([opcode]) + struct.pack("<i", value)

          arrangement_meter_markers = (
              bytes([0x63, 0, 0])
              + dword_event(0x94, 0x08000000)
              + bytes([0x21, 3, 0x22, 4])
              + dword_event(0x94, 0x08000000 | 576)
              + bytes([0x21, 5, 0x22, 8])
              + bytes([0x62, 0, 0])
          )

          def playlist_track(track_id, name, grouped=False):
              state = bytearray(70)
              struct.pack_into("<I", state, 0, track_id)
              state[12] = 1
              state[46] = int(grouped)
              return (
                  data_event(0xEE, bytes(state))
                  + bytes([0x2B, 0])
                  + data_event(0xEF, name.encode("utf-8") + b"\0")
              )

          playlist_track_states = (
              playlist_track(1, "Drums")
              + playlist_track(2, "Percussion", grouped=True)
              + playlist_track(3, "Bass")
          )

          master_target = 64 << 6
          target = 65 << 6
          parameters = (
              bytes([0xA1, 0xB2, 0xC3, 0xD4, 192, 0])
              + struct.pack("<H", master_target)
              + struct.pack("<i", 12800)
              + bytes([0xA2, 0xB3, 0xC4, 0xD5, 193, 0])
              + struct.pack("<H", master_target)
              + struct.pack("<i", 0)
              + bytes([0xA3, 0xB4, 0xC5, 0xD6, 194, 0])
              + struct.pack("<H", master_target)
              + struct.pack("<i", 0)
              + bytes([0xAA, 0xBB, 0xCC, 0xDD, 192, 0])
              + struct.pack("<H", target)
              + struct.pack("<i", 12800)
              + bytes([0x11, 0x22, 0x33, 0x44, 193, 0])
              + struct.pack("<H", target)
              + struct.pack("<i", 0)
              + bytes([0x55, 0x66, 0x77, 0x88, 194, 0])
              + struct.pack("<H", target)
              + struct.pack("<i", -16)
              + bytes([0x77, 0x88, 0x99, 0xAA, 64, 0])
              + struct.pack("<H", target)
              + struct.pack("<i", 6800)
          )
          master_insert = (
              dword_event(0x9A, -1)
              + dword_event(0x93, 0)
              + dword_event(0x95, 0x006A8DCE)
              + data_event(0xEC, bytes(4) + struct.pack("<I", 1 << 3) + bytes(4))
              + b"".join(bytes([0x62, slot, 0]) for slot in range(10))
              + dword_event(0x93, -1)
          )
          drum_bus_insert = (
              dword_event(0x9A, -1)
              + dword_event(0x93, -1)
              + dword_event(0x95, 0x006A8DCE)
              + data_event(0xEC, bytes(4) + struct.pack("<I", 1 << 3) + bytes(4))
              + data_event(0xCC, b"Drum Bus\0")
              + data_event(0xE1, parameters)
              + bytes([0x62, 0, 0])
              + data_event(0xC9, b"Fruity Parametric EQ 2\0")
              + data_event(0xCB, b"Drum EQ\0")
              + data_event(0xD5, b"preview state")
              + b"".join(bytes([0x62, slot, 0]) for slot in range(1, 10))
              + dword_event(0x93, -1)
          )
          event_stream = (
              arrangement_meter_markers
              + playlist_track_states
              + bytes([0x40, 0, 0, 0x15, 0])
              + data_event(0xE7, bytes([1]))
              + master_insert
              + drum_bus_insert
              + data_event(0xC9, b"outside the insert\0")
          )
          project = (
              b"FLhd"
              + struct.pack("<IHHH", 6, 0, 0, 96)
              + b"FLdt"
              + struct.pack("<I", len(event_stream))
              + event_stream
          )
          Path(sys.argv[1]).write_bytes(project)
          controller_records = b"".join(
              struct.pack("<I2sBBf", position, b"\xA5\x5A", 2, 0x24, value)
              for position, value in [(0, 0.15), (192, 0.78), (384, 0.36), (576, 0.9)]
          )

          def pattern_note(channel_id, key, position=0):
              return struct.pack(
                  "<IHHIHH8B",
                  position,
                  0x4000,
                  channel_id,
                  192,
                  key,
                  0,
                  0,
                  0,
                  0,
                  0,
                  64,
                  100,
                  0,
                  0,
              )

          note_records = (
              pattern_note(0, 60)
              + pattern_note(0, 64, 96)
              + pattern_note(0, 67, 192)
              + pattern_note(1, 64, 288)
          )
          pattern_events = (
              bytes([0x40, 0, 0, 0x40, 1, 0, 0x41, 7, 0])
              + data_event(0xD0, note_records)
              + data_event(0xDF, controller_records)
          )
          controller_project = (
              b"FLhd"
              + struct.pack("<IHHH", 6, 0, 0, 96)
              + b"FLdt"
              + struct.pack("<I", len(pattern_events))
              + pattern_events
          )
          Path(sys.argv[2]).write_bytes(controller_project)

          modern_pattern_record = bytearray(88)
          struct.pack_into("<IHHIHH", modern_pattern_record, 0, 0, 0x5000, 0x5001, 1536, 499, 0)
          modern_pattern_record[20:24] = bytes([0x40, 0x64, 0x80, 0x80])
          struct.pack_into("<II", modern_pattern_record, 24, 0, 1536)
          modern_pattern_events = (
              data_event(0xC7, b"26.1.0.0\0")
              + bytes([0x63, 0, 0])
              + data_event(0xE9, bytes(modern_pattern_record))
          )
          modern_pattern_project = (
              b"FLhd"
              + struct.pack("<IHHH", 6, 0, 0, 96)
              + b"FLdt"
              + struct.pack("<I", len(modern_pattern_events))
              + modern_pattern_events
          )
          Path(sys.argv[3]).write_bytes(modern_pattern_project)
          PY

          mixer_summary=$(cargo run --quiet --release --bin flp-rebuild -- mixer "$RUNNER_TEMP/mixer-preview.flp")
          printf '%s\n' "$mixer_summary"
          if ! grep -Fq "recognized effect slot records: 20" <<< "$mixer_summary"; then
            echo "The Mixer preview project did not decode all twenty effect slots."
            exit 1
          fi
          if ! grep -Fq "insert=1 slot=0 plugin=Fruity Parametric EQ 2 name=Drum EQ state_events=1" <<< "$mixer_summary"; then
            echo "The Mixer preview effect was not assigned to Drum Bus slot zero."
            exit 1
          fi

          target/release/fl-studio-rebuild "$RUNNER_TEMP/mixer-preview.flp" \
            > "$RUNNER_TEMP/mixer-preview.log" 2>&1 &
          app_pid=$!
          for attempt in $(seq 1 10); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/mixer-preview.log"
              exit 1
            fi
            sleep 1
          done
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-meter.png"
          xdotool mousemove 700 276 click 1
          sleep 1
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-seek.png"
          xdotool mousemove 351 302 keydown Control_L click 1 keyup Control_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-solo.png"
          xdotool mousemove 351 329 keydown Alt_L click 3 keyup Alt_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-group-solo.png"
          xdotool mousemove 376 302 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-groups-collapsed.png"
          xdotool mousemove 625 111 click 1
          sleep 2
          xdotool mousemove 500 240 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer.png"
          xdotool mousemove 1280 550 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-sends.png"
          xdotool mousemove 1350 830 click --repeat 4 --delay 50 5
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-effect-slots-scrolled.png"
          xdotool mousemove 1350 830 click --repeat 4 --delay 50 4
          sleep 0.5
          xdotool mousemove 356 270 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-muted.png"
          xdotool mousemove 398 270 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-muted-solo.png"
          xdotool mousemove 1219 321 click 1
          sleep 0.3
          xdotool mousemove 1322 321 click 1
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-phase-swap.png"

          mixer_window=$(xdotool search --onlyvisible --name '^FL Studio Rebuild$' | head -n 1 || true)
          if [[ -z "$mixer_window" ]]; then
            echo "Could not find the Mixer preview window for detaching checks."
            cat "$RUNNER_TEMP/mixer-preview.log"
            exit 1
          fi
          xdotool windowfocus --sync "$mixer_window"
          xdotool mousemove 287 16 click 1
          sleep 0.3
          xdotool mousemove 350 244 click 1
          sleep 1
          detached_mixer_window=$(xdotool search --onlyvisible --name '^Mixer$' | head -n 1 || true)
          if [[ -z "$detached_mixer_window" ]]; then
            echo "View > Detach Mixer did not open its native window."
            cat "$RUNNER_TEMP/mixer-preview.log"
            exit 1
          fi
          xdotool windowmove "$detached_mixer_window" 420 48
          xdotool windowfocus --sync "$detached_mixer_window"
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/mixer-detached-window.png"
          xdotool windowfocus --sync "$mixer_window"
          xdotool mousemove 287 16 click 1
          sleep 0.3
          xdotool mousemove 350 244 click 1
          sleep 1
          if xdotool search --onlyvisible --name '^Mixer$' >/dev/null 2>&1; then
            echo "View > Dock Mixer did not close the native editor window."
            cat "$RUNNER_TEMP/mixer-preview.log"
            exit 1
          fi

          xdotool key F6
          sleep 1
          xdotool mousemove 287 16 click 1
          sleep 0.3
          xdotool mousemove 350 269 click 1
          sleep 1
          detached_channel_rack_window=$(xdotool search --onlyvisible --name '^Channel Rack$' | head -n 1 || true)
          if [[ -z "$detached_channel_rack_window" ]]; then
            echo "View > Detach Channel Rack did not open its native window."
            cat "$RUNNER_TEMP/mixer-preview.log"
            exit 1
          fi
          xdotool windowmove "$detached_channel_rack_window" 420 48
          xdotool windowfocus --sync "$detached_channel_rack_window"
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/channel-rack-detached-window.png"
          xdotool windowfocus --sync "$mixer_window"
          xdotool mousemove 287 16 click 1
          sleep 0.3
          xdotool mousemove 350 269 click 1
          sleep 1
          if xdotool search --onlyvisible --name '^Channel Rack$' >/dev/null 2>&1; then
            echo "View > Dock Channel Rack did not close the native editor window."
            cat "$RUNNER_TEMP/mixer-preview.log"
            exit 1
          fi

          xdotool key F5
          sleep 1
          xdotool mousemove 287 16 click 1
          sleep 0.3
          xdotool mousemove 350 319 click 1
          sleep 1
          detached_playlist_window=$(xdotool search --onlyvisible --name '^Playlist$' | head -n 1 || true)
          if [[ -z "$detached_playlist_window" ]]; then
            echo "View > Detach Playlist did not open its native window."
            cat "$RUNNER_TEMP/mixer-preview.log"
            exit 1
          fi
          xdotool windowmove "$detached_playlist_window" 420 48
          xdotool windowsize "$detached_playlist_window" 1000 650
          xdotool windowfocus --sync "$detached_playlist_window"
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/playlist-detached-window.png"
          xdotool windowfocus --sync "$mixer_window"
