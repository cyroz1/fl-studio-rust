              offset += 12 + size

          channels = {2: 3, 6: 4}.get(color_type)
          if bit_depth != 8 or channels is None or interlace != 0:
              raise SystemExit("Unsupported PNG format in the Playlist resize capture.")
          bytes_per_pixel = channels
          stride = width * bytes_per_pixel
          pixels = zlib.decompress(b"".join(compressed))
          previous = bytearray(stride)
          row_offset = 0
          purple_x = []
          for y in range(height):
              filter_type = pixels[row_offset]
              row_offset += 1
              row = bytearray(pixels[row_offset : row_offset + stride])
              row_offset += stride
              for index in range(stride):
                  left = row[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  above = previous[index]
                  upper_left = (
                      previous[index - bytes_per_pixel] if index >= bytes_per_pixel else 0
                  )
                  if filter_type == 1:
                      row[index] = (row[index] + left) & 255
                  elif filter_type == 2:
                      row[index] = (row[index] + above) & 255
                  elif filter_type == 3:
                      row[index] = (row[index] + (left + above) // 2) & 255
                  elif filter_type == 4:
                      estimate = left + above - upper_left
                      distances = (
                          abs(estimate - left),
                          abs(estimate - above),
                          abs(estimate - upper_left),
                      )
                      predictor = (
                          left if distances[0] <= distances[1] and distances[0] <= distances[2]
                          else above if distances[1] <= distances[2]
                          else upper_left
                      )
                      row[index] = (row[index] + predictor) & 255
              if 286 <= y <= 310:
                  for x in range(width):
                      index = x * bytes_per_pixel
                      red, green, blue = row[index : index + 3]
                      if red > 100 and blue > 140 and blue - red > 20 and green < 190:
                          purple_x.append(x)
              previous = row

          if not purple_x:
              raise SystemExit("Could not locate the Pattern Clip in the resize capture.")
          # Start four pixels inside the detected right edge, within the resize hit zone.
          print(max(purple_x) - 3)
          PY
          )
          resize_end_x=$((resize_start_x + 41))
          xdotool keydown Shift_L
          xdotool mousemove --sync "$resize_start_x" 298
          xdotool mousedown 1
          sleep 0.2
          xdotool mousemove --sync "$resize_end_x" 298
          sleep 0.3
          xdotool mouseup 1
          xdotool keyup Shift_L
          sleep 0.5
          ffmpeg -y -loglevel error -f x11grab -draw_mouse 0 -video_size 1600x900 -framerate 1 \
            -i "$DISPLAY" -frames:v 1 "$GITHUB_WORKSPACE/dist/gui-preview/modern-pattern-clip-after-resize.png"
          xdotool key ctrl+s
          sleep 1
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo "The app exited while saving the resized modern Pattern Clip."
            cat "$RUNNER_TEMP/pattern-preview.log"
            exit 1
          fi
          resized_pattern_summary=$(cargo run --quiet --release --bin flp-rebuild -- playlist "$RUNNER_TEMP/pattern-preview.flp")
          if ! grep -Fq "clip=0 position=0 length=1944" <<< "$resized_pattern_summary"; then
            echo "Shift-drag did not persist the modern Pattern Clip resize."
            printf '%s\n' "$resized_pattern_summary"
            cat "$RUNNER_TEMP/pattern-preview.log"
            exit 1
          fi
          for capture in browser-search-options.png audio-settings-scrolled.png audio-detached-scrolled.png \
            playlist-solo.png playlist-group-solo.png playlist-groups-collapsed.png \
            mixer.png mixer-effect-slots-scrolled.png mixer-muted.png mixer-muted-solo.png mixer-phase-swap.png controller-ghost-visibility.png \
            controller-ghost-editable.png controller-ghost-editable-shortcut.png controller-color-selection.png \
            piano-roll-scale-automatic.png piano-roll-tools-menu.png piano-roll-chord-stamp-toolbar.png piano-roll-chord-stamps.png \
            modern-pattern-clip-before-resize.png modern-pattern-clip-after-resize.png \
            piano-roll-time-selection.png piano-roll-pitch-selection.png piano-roll-mousewheel-property.png \
            piano-roll-mousewheel-nudge.png controller-event-draw.png controller-event-paint.png \
            piano-roll-detached-window.png mixer-detached-window.png channel-rack-detached-window.png \
            playlist-detached-window.png detached-window-recovery.png plugins-detached-window.png audio-detached-window.png \
            automation-detached-window.png \
            controller-event-draw-alt-bypass.png controller-event-paint-shift-lock.png \
            controller-event-interpolate-selecting.png controller-event-interpolate.png \
            controller-event-spline-selecting.png controller-event-spline.png \
            controller-event-erase-selecting.png controller-event-erase.png; do
            if [[ "$(stat -c%s "$GITHUB_WORKSPACE/dist/gui-preview/$capture")" -lt 10000 ]]; then
              echo "The $capture capture is blank or incomplete."
              cat "$RUNNER_TEMP/mixer-preview.log"
              exit 1
            fi
          done
          BASH
          xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24 +extension GLX" \
            bash "$RUNNER_TEMP/capture-ui.sh"

      - name: Launch Linux AppImage on a virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(dist/*.AppImage)
          if (( ${#appimages[@]} != 1 )); then
            echo "::error::Expected exactly one Linux AppImage; found ${#appimages[@]}."
            printf '%s\n' "${appimages[@]}"
            exit 1
          fi
          appimage="${appimages[0]}"
          chmod +x "$appimage"
          mkdir -p "$RUNNER_TEMP/appimage-config" "$RUNNER_TEMP/appimage-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/appimage-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/appimage-data"
          appimage_log="$RUNNER_TEMP/appimage-launch.log"
          xvfb-run --auto-servernum --server-args="-screen 0 1600x900x24 +extension GLX" \
            bash -euo pipefail -c '
              appimage="$1"
              log="$2"
              "$appimage" --appimage-extract-and-run > "$log" 2>&1 &
              app_pid=$!
              cleanup() {
                kill "$app_pid" 2>/dev/null || true
                wait "$app_pid" 2>/dev/null || true
              }
              trap cleanup EXIT
              sleep 8
              if ! kill -0 "$app_pid" 2>/dev/null; then
                set +e
                wait "$app_pid"
                app_status=$?
                set -e
                echo "::error::The Linux AppImage exited during launch with status $app_status."
                cat "$log"
                exit 1
              fi
              echo "Linux AppImage remained running after launch."
            ' _ "$appimage" "$appimage_log"

      - name: Build signed and notarized macOS installer
        if: runner.os == 'macOS' && steps.macos-signing-status.outputs.available == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: cargo packager --release --config Packager.signed.toml

      - name: Sign, notarize, and verify macOS disk image
        if: runner.os == 'macOS' && steps.macos-signing-status.outputs.available == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          app_bundles=(dist/*.app)
          disk_images=(dist/*.dmg)
          if (( ${#app_bundles[@]} != 1 )); then
            echo "::error::Expected exactly one macOS app bundle; found ${#app_bundles[@]}."
            printf '%s\n' "${app_bundles[@]}"
            exit 1
          fi
          if (( ${#disk_images[@]} != 1 )); then
            echo "::error::Expected exactly one macOS disk image; found ${#disk_images[@]}."
            printf '%s\n' "${disk_images[@]}"
            exit 1
          fi
          disk_image="${disk_images[0]}"

          mount_path="$RUNNER_TEMP/fl-studio-installer"
          cleanup() {
            hdiutil detach "$mount_path" -quiet 2>/dev/null || true
          }
          trap cleanup EXIT

          codesign --force --timestamp --keychain "$APPLE_SIGNING_KEYCHAIN" \
            --sign "$APPLE_SIGNING_IDENTITY" "$disk_image"
          xcrun notarytool submit "$disk_image" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --key "$APPLE_API_KEY_PATH" \
            --wait --output-format json > "$RUNNER_TEMP/fl-studio-dmg-notarization.json"
          python3 - "$RUNNER_TEMP/fl-studio-dmg-notarization.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if result.get("status") != "Accepted":
              raise SystemExit(f"Disk image notarization was not accepted: {result.get('status')!r}")
          PY
          xcrun stapler staple "$disk_image"
          xcrun stapler validate "$disk_image"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$disk_image"

          mkdir -p "$mount_path"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "$disk_image"
          app_path="$(find "$mount_path" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "::error::The macOS installer does not contain an app bundle."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS' && steps.macos-signing-status.outputs.available == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          app_bundles=(dist/*.app)
          if (( ${#app_bundles[@]} != 1 )); then
            echo "::error::Expected exactly one signed macOS app bundle; found ${#app_bundles[@]}."
            printf '%s\n' "${app_bundles[@]}"
            exit 1
          fi
          app_path="${app_bundles[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

      - name: Install and launch macOS app from disk image
        if: runner.os == 'macOS' && steps.macos-signing-status.outputs.available == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          disk_images=(dist/*.dmg)
          if (( ${#disk_images[@]} != 1 )); then
            echo "::error::Expected exactly one macOS disk image; found ${#disk_images[@]}."
            printf '%s\n' "${disk_images[@]}"
            exit 1
          fi

          mount_path="$RUNNER_TEMP/fl-studio-smoke-mount"
          install_dir="$RUNNER_TEMP/Applications"
          mkdir -p "$mount_path" "$install_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_path" "${disk_images[0]}"
          cleanup() {
            hdiutil detach "$mount_path" -quiet 2>/dev/null || true
            if [[ -n "${app_pid:-}" ]]; then
              kill "$app_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          source_app="$(find "$mount_path" -maxdepth 2 -type d -name '*.app' -print -quit)"
          if [[ -z "$source_app" ]]; then
            echo "::error::The macOS disk image does not contain an app bundle."
            exit 1
          fi
          app_path="$install_dir/$(basename "$source_app")"
          ditto "$source_app" "$app_path"
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
          app_binary="$app_path/Contents/MacOS/$app_executable"
          if [[ ! -x "$app_binary" ]]; then
            echo "::error::The installed macOS app executable is missing or not executable."
            exit 1
          fi

          open -a "$app_path"
          for attempt in $(seq 1 30); do
            app_pid="$(pgrep -f "$app_binary" | head -n 1 || true)"
            if [[ -n "$app_pid" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "$app_pid" ]]; then
            echo "::error::The installed macOS app did not stay running after launch."
            exit 1
          fi
          sleep 3
          echo "Installed macOS app remained running after launch."

      - name: Stage exactly one platform installer
        if: runner.os != 'macOS' || steps.macos-signing-status.outputs.available == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          case "$RUNNER_OS" in
            Linux) installers=(dist/*.AppImage) ;;
            Windows) installers=(dist/*-setup.exe) ;;
            macOS) installers=(dist/*.dmg) ;;
            *)
              echo "::error::Unsupported installer platform: $RUNNER_OS"
              exit 1
              ;;
          esac
          if (( ${#installers[@]} != 1 )); then
            echo "::error::Expected exactly one $RUNNER_OS installer in dist; found ${#installers[@]}."
            printf '%s\n' "${installers[@]}"
            exit 1
          fi
          mkdir -p dist/ci-installer
          cp "${installers[0]}" dist/ci-installer/
          staged_installers=(dist/ci-installer/*)
          if (( ${#staged_installers[@]} != 1 )); then
            echo "::error::Expected exactly one staged installer; found ${#staged_installers[@]}."
            printf '%s\n' "${staged_installers[@]}"
            exit 1
          fi
          echo "Staged installer: ${staged_installers[0]}"

      - name: Upload Linux AppImage installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/ci-installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows setup installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/ci-installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed macOS disk image
        if: runner.os == 'macOS' && steps.macos-signing-status.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/ci-installer/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary macOS signing files
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          keychain_path="${APPLE_SIGNING_KEYCHAIN:-$RUNNER_TEMP/fl-studio-signing.keychain-db}"
          security delete-keychain "$keychain_path" 2>/dev/null || true
          rm -f Packager.signed.toml \
            "${APPLE_SIGNING_CERTIFICATE_PATH:-$RUNNER_TEMP/fl-studio-signing.p12}" \
            "${APPLE_API_KEY_PATH:-}"
