[package]
name = "flp-rebuild"
version = "0.1.0"
edition = "2024"
description = "A clean-room Rust compatibility core for FL Studio project files"
license = "MIT"

[dependencies]
arc-swap = "1.7.1"
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "wgpu", "x11"] }
flacenc = { version = "0.5.1", default-features = false }
md-5 = "0.10.6"
midir = "0.11.0"
rfd = "0.17.2"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
wavicle = { version = "0.1.0", default-features = false, features = ["decode"] }
vst3-host = { version = "0.9.0", default-features = false }
vorbis_rs = "0.5.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.25.0"

[lib]
name = "flp_rebuild"
path = "src/lib.rs"

[[bin]]
name = "flp-rebuild"
path = "src/main.rs"
