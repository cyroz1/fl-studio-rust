[package]
name = "flp-rebuild"
version = "0.1.0"
edition = "2024"
description = "A clean-room Rust compatibility core for FL Studio project files"
license = "MIT"

[dependencies]
arc-swap = "1.7.1"
crossbeam-queue = "0.3.14"
clack-extensions = { version = "0.2.0", default-features = false, features = ["audio-ports", "clack-host", "note-ports", "params"] }
clack-host = "0.2.0"
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "wgpu", "x11"] }
flacenc = { version = "0.5.1", default-features = false }
md-5 = "0.10.6"
mp3lame-encoder = "0.2.5"
midir = "0.11.0"
rfd = "0.17.2"
serde_json = "1.0.152"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
timestretch = "0.15.0"
wavicle = { version = "0.1.0", default-features = false, features = ["decode"] }
vst3-host = { version = "0.10.0", default-features = false, features = ["process-isolation"] }
vorbis_rs = "0.5.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "unreserved"] }
plist = "1.10.1"

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18.2", features = ["asio"] }
wasapi = "0.25.0"

[target.'cfg(all(target_os = "linux", not(target_arch = "x86")))'.dependencies]
cpal = { version = "0.18.2", features = ["jack", "pipewire", "pulseaudio"] }

[target.'cfg(all(target_os = "linux", target_arch = "x86"))'.dependencies]
cpal = "0.18.2"

[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
cpal = "0.18.2"

[lib]
name = "flp_rebuild"
path = "src/lib.rs"

[[bin]]
name = "flp-rebuild"
path = "src/main.rs"
